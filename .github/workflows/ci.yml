name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: vet + test + race + cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -timeout 300s

      - name: go test -race
        run: go test -race ./... -count=1 -timeout 300s

      - name: cross compile
        run: |
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o /dev/null ./searchboard
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o /dev/null ./searchboard
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -o /dev/null ./searchboard
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./searchboard
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./searchboard
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o /dev/null ./searchboard
          CGO_ENABLED=0 go build -o /dev/null ./cmd/framework-demo
