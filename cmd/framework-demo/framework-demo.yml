# framework-demo 配置（YAML 是本仓库唯一配置形态）。
# 修改后重启 demo 生效。

http:
  addr: 127.0.0.1:8080      # HTTP/1.1 监听地址
  transport: auto           # auto | netpoll | std
                             #   auto   ：linux/darwin 用 netpoll，其余平台（含 Windows）自动回退 std
                             #   netpoll：强制 netpoll（不支持平台启动时报错回退）
                             #   std    ：强制标准库 net
  idleTimeout: 120s         # keep-alive 空闲时限
  readHeaderTimeout: 10s    # 读请求头时限
  writeTimeout: 30s         # 响应写出时限
  enableH2C: false          # 明文 HTTP/2（prior-knowledge）——需客户端主动 h2c
  # maxConcurrentStreams: 256  # HTTP/2 每连接并发流上限（0=按规范默认）

quic:
  enable: true              # QUIC/HTTP3 总开关（复用同套路由）
  addr: 127.0.0.1:8443      # UDP 监听地址
  # certFile: cert.pem      # 正式证书（可选；都为空时按 autoCertHosts 自签）
  # keyFile: key.pem
  autoCertHosts:            # 自签证书 SAN（开发/演示用）
    - 127.0.0.1
    - localhost
